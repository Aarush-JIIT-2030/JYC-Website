  <body>
    <script>
      // Development safety: an older service worker can otherwise return a stale React/Vite module
      // before the new app gets a chance to unregister it. This is what can surface old lazy-module errors.
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        navigator.serviceWorker?.getRegistrations?.().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
        window.caches?.keys?.().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
